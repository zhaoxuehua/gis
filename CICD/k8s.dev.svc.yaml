apiVersion: v1
kind: Service
metadata:
  labels:
    app: kubesphere
    component: $DEPLOY_NAME
  name: $DEPLOY_NAME
  namespace: $NAMESPACE
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
  selector:
    app: kubesphere
    component: $DEPLOY_NAME
    tier: frontend
  sessionAffinity: None
  type: ClusterIP
